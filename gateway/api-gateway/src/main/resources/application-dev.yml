spring:
  profiles: dev
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
            - name: JwtAuthenticationFilter
        
        - id: claim-service
          uri: http://localhost:8084
          predicates:
            - Path=/claim/**
          filters:
            - StripPrefix=1
            - name: JwtAuthenticationFilter

logging:
  level:
    root: DEBUG
