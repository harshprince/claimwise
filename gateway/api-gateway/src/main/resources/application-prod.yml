spring:
  profiles: prod
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
            - name: JwtAuthenticationFilter
        
        - id: claim-service
          uri: lb://CLAIM-SERVICE
          predicates:
            - Path=/claim/**
          filters:
            - StripPrefix=1
            - name: JwtAuthenticationFilter

logging:
  level:
    root: WARN
