server:
  port: 8888
  ssl: # Enable in production
    enabled: false # Set to true with keystore

spring:
  application:
    name: config-server
  security:
    user:
      name: claimwise  # Env var with default
      password: 123456   # MUST be set externally
  cloud:
    config:
      server:
        git:
          uri: https://github.com/harshprince/claimwise
          search-paths: config
          default-label: main
          username: ${GIT_USER:}      # GitHub username
          password: ${GIT_TOKEN:}     # GitHub PAT (personal access token)
          clone-on-start: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.int}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always